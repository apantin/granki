<path class="bar" d="M268.0,250 V164.7 Q268.0,160.7 272.0,160.7 H288.0 Q292.0,160.7 292.0,164.7 V250 Z"><title>кэш, 4-ядерные, 3–14 ноября: медиана 502 с (75 сборок)</title></path>
