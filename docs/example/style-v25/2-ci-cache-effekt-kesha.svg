<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-labelledby="t d">
<title id="t">Медиана длительности полного пайплайна, с (число сборок)</title>
<desc id="d">без кэша, 4-ядерные, 6–31 октября: 888 с (145 сборок); кэш, 4-ядерные, 3–14 ноября: 502 с (75 сборок); кэш, 8-ядерные, 17–28 ноября: 338 с (69 сборок). Между вторым и третьим периодом — другие раннеры.</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bg { fill: #fcfcfb; }
  .bar { fill: #2a78d6; }
  .val { fill: #0b0b0b; font-size: 14px; font-weight: 600; text-anchor: middle; }
  .lab { fill: #0b0b0b; font-size: 13px; text-anchor: middle; }
  .lab2, .sepl { fill: #52514e; font-size: 13px; text-anchor: middle; }
  .sepl, .cap { text-anchor: start; }
  .cap { fill: #52514e; font-size: 13px; }
  .axis { stroke: #52514e; stroke-width: 1; }
  .sep { stroke: #52514e; stroke-width: 1; stroke-dasharray: 4 4; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .bar { fill: #3987e5; }
    .val, .lab { fill: #f0efec; }
    .lab2, .sepl, .cap { fill: #c3c2b7; }
    .axis, .sep { stroke: #c3c2b7; }
  }
</style>
